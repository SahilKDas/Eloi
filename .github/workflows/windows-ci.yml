name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 python-chess==1.999 PyYAML==6.0.2
      - name: Validate repository whitespace
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } else {
            git diff-tree --check --no-commit-id --root -r HEAD
          }
      - name: Validate issue-form YAML
        shell: pwsh
        run: python -c "import pathlib,yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in pathlib.Path('.github/ISSUE_TEMPLATE').glob('*.yml')]"
      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s scripts -p "test_*.py"

  cpp-source-only:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure source-only tests
        shell: msys2 {0}
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DELOI_BUILD_APP=OFF -DELOI_BUILD_CAISSA_125_LAB=ON -DELOI_BUILD_TESTS=ON
      - name: Build source-only tests
        shell: msys2 {0}
        run: cmake --build build-ci --parallel 2
      - name: Run C++ tests
        shell: msys2 {0}
        run: ctest --test-dir build-ci --output-on-failure --timeout 120
