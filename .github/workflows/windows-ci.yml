name: Windows CI

on:
  push:
    branches: [main, v4.0.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 python-chess==1.999 PyYAML==6.0.2 psutil==7.2.2
      - name: Validate repository whitespace
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } else {
            git diff-tree --check --no-commit-id --root -r HEAD
          }
      - name: Validate issue-form YAML
        shell: pwsh
        run: python -c "import pathlib,yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in pathlib.Path('.github/ISSUE_TEMPLATE').glob('*.yml')]"
      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s scripts -p "test_*.py"

  rust-source-only:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain
      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Run Rust source tests (no donor or model download)
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: "2"
          # Each search fixture owns three lanes. Do not oversubscribe the host
          # by running deadline-sensitive search fixtures simultaneously.
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --locked
